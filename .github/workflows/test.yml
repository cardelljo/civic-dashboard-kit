# Both halves of the package gate every PR. A JS-only change must not be able
# to ship without the Python tests, or vice versa (docs/ARCHITECTURE.md §7) --
# `tests/test_data_status_union.py` in the python job reads `ui/types.ts`, so
# the two are not independent even when a diff touches only one language.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis rather than plain postgres:16 -- same image family the
        # shared instance is provisioned from (docs/ARCHITECTURE.md §3), so a
        # test that starts depending on PostGIS does not need a CI change first.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civic_toolkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with all extras
        run: pip install -e ".[ai,postgres]" pytest

      - name: Run tests
        env:
          # tests/test_ci_guards.py fails the job if this is missing, rather
          # than letting the Postgres tests skip into a green build.
          CI: 'true'
          TOOLKIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civic_toolkit_test
        # -rs prints the reason for every skip, so the log shows what did not run.
        run: pytest -v -rs

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # No build step -- this package ships raw .tsx and consumers transpile it.
      # tsc is therefore the only thing that would catch a type error before a
      # dashboard's own build does.
      - run: npm run typecheck

      - run: npm test
