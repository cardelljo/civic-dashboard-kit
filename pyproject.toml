[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-dashboard-kit"
version = "0.2.0"
description = "Data-acquisition clients, a source-provenance contract, and an append-only observations store for building honest, sourced civic data dashboards."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Bluff City Tech" },
]
keywords = ["civic-tech", "open-data", "dashboard", "census", "etl"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Sociology",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Only needed by ai_extract.py / pdf_report.py (T3 AI-assisted extraction jobs).
# langextract has no native Anthropic backend (Gemini/OpenAI/Ollama only) --
# ai_extract.py remains the Anthropic-native path (901economy PLAN.md §0.4).
ai = [
    "pymupdf>=1.24.0",
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-generativeai>=0.7.0",
    "langextract>=1.0.0",
]
# Only needed by postgres_store.py -- a dashboard whose store is still the
# SQLite/NDJSON pattern (observations.py) doesn't need a Postgres driver.
postgres = [
    "psycopg2-binary>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Standard src-layout: without this, pytest would import tests against
# whatever `toolkit` happens to be first on sys.path (e.g. a stale editable
# install) instead of always this checkout's src/toolkit -- and a bare
# module at the repo root here (rather than nested under src/) previously
# collided with pytest's own rootdir path insertion. See README.md's
# Installing section for the distribution-name-vs-import-name note.
pythonpath = ["src"]
