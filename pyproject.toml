[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-toolkit"
version = "0.1.0"
description = "Shared data-acquisition clients for Bluff City Tech civic dashboards (901justice, 901education, 901economy)."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Only needed by ai_extract.py / pdf_report.py (T3 AI-assisted extraction jobs).
ai = [
    "pymupdf>=1.24.0",
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-generativeai>=0.7.0",
]

[tool.setuptools]
packages = ["toolkit"]
package-dir = {"toolkit" = "."}
